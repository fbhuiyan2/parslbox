[tool.poetry]
name = "parslbox"
version = "1.0.1"
description = ""
authors = ["fbhuiyan2 <fakhrul.hasan117@gmail.com>"]
readme = "README.md"
packages = [{include = "parslbox"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
typer = {version = ">=0.17.4,<0.18.0", extras = ["all"]}
numpy = ">=2.3.3,<3.0.0"
pyyaml = ">=6.0.2,<7.0.0"
parsl = ">=2025.9.8,<2027.0.0"
ase = { version = ">=3.26.0,<4.0.0", optional = true }
pymatgen = { version = ">=2025.6.14,<2026.0.0", optional = true }
uvicorn = {version = "^0.38.0", optional = true}
mcp = {version = "^1.23.1", optional = true}
pydantic = {version = "^2.12.5", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[tool.poetry.extras]
simulation = ["ase", "pymatgen"]
agentic = ["uvicorn", "mcp", "pydantic"]
all = ["ase", "pymatgen", "uvicorn", "mcp", "pydantic"]

[tool.poetry.scripts]
pbx = "parslbox.main:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
